[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minirefmac"
version = "0.2.0"
description = "From-scratch REFMAC5-like maximum-likelihood macromolecular refinement, with a self-contained monomer dictionary"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary (code); bundled monomer dictionary is LGPL-3.0"}
keywords = ["crystallography", "refinement", "maximum likelihood", "REFMAC", "structure factors"]
dependencies = [
    "gemmi>=0.6.5",
    "numpy>=1.20",
    "scipy>=1.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.scripts]
minirefmac = "minirefmac.cli:main"
minirefmac-selftest = "minirefmac.selftest:main"

[project.gui-scripts]
minirefmac-gui = "minirefmac.gui:main"

[tool.setuptools]
packages = ["minirefmac", "minirefmac.data"]

[tool.setuptools.package-data]
# The bundled restraint dictionary MUST ship with the package; runtime never
# reads an external dictionary directory.
"minirefmac.data" = ["monlib_bundle.zip", "LICENSE-CCP4-MONOMERS.txt"]
# Optional AVX-512 kernel source; the shared object is built on demand.
"minirefmac" = ["_simd.c"]
